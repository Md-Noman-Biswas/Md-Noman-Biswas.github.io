bio: |
  I am a final-year **B.Sc. student in Electrical and Computer Engineering** at [Rajshahi University of Engineering & Technology (RUET)](https://www.ruet.ac.bd/), Bangladesh. My research sits at the intersection of **Trustworthy AI**, deep learning, and computer vision — with a focus on building reliable, interpretable AI systems for high-stakes domains such as medical imaging.

  My current work asks **which reliability signals actually hold up under distribution shift** — comparing output-space and representation-space uncertainty in pathology foundation models (MICCAI 2026 workshop) — alongside noise-robust medical image classification with adversarial denoising and vision transformers. As a research assistant at the ELITE Research Lab I also work on **mechanistic interpretability**, making model predictions explainable rather than merely accurate.

  I have a strong competitive programming background (Codeforces Pupil, max rating 1263; ~1,700 problems solved across Codeforces, LeetCode, and VJudge) and experience taking neural networks all the way down to bare-metal microcontrollers.
seeking: |
